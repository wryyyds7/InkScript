# 同类产品调研字段定义
# 每个字段对应报告中的一个维度

fields:
  - id: core_features
    name: 核心功能
    description: 该产品提供的主要功能和能力
    type: text
    required: true

  - id: tech_stack
    name: 技术栈
    description: 使用的技术架构、桌面端实现方式、后端技术
    type: text
    required: false

  - id: ai_capabilities
    name: AI 能力
    description: 是否集成 AI、集成方式、AI 功能有哪些
    type: text
    required: true

  - id: user_experience
    name: 用户体验
    description: UI/UX 亮点、交互设计、用户反馈
    type: text
    required: false

  - id: pricing
    name: 定价策略
    description: 免费/付费模式、价格区间、 licensing 方式
    type: text
    required: false

  - id: limitations
    name: 不足之处
    description: 用户抱怨的点、功能缺失、技术限制
    type: text
    required: true

  - id: inspiration
    name: 对 Novel2Script 的启发
    description: 可以借鉴的功能设计、需要避免的问题
    type: text
    required: true

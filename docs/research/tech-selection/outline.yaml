# 技术选型调研大纲 - Novel2Script
# 调研目标：对比评估各技术选项，为架构设计提供决策依据
# 重点关注：桌面端壳技术、前端编辑器、后端框架

items:
  - id: pywebview_vs_electron
    name: PyWebView vs Electron（桌面壳技术）
    description: 对比 PyWebView 和 Electron 在桌面应用开发中的优劣
    priority: high
    search_queries:
      - "PyWebView vs Electron comparison 2024 desktop app"
      - "PyWebView 桌面应用 性能 打包 体验"
      - "Electron vs PyWebView pros cons 2024"
      - "Python 桌面应用开发 PyWebView 实战"

  - id: tauri_evaluation
    name: Tauri 作为替代方案评估
    description: 考察 Tauri 是否适合作为 Novel2Script 的桌面壳替代方案
    priority: medium
    search_queries:
      - "Tauri vs Electron vs PyWebView comparison 2024"
      - "Tauri Python backend integration"
      - "Tauri 桌面应用 打包大小 性能"
      - "Tauri 是否适合 Python 后端项目"

  - id: codemirror_vs_monaco
    name: CodeMirror 6 vs Monaco Editor（编辑器组件）
    description: 对比两款 Web 代码编辑器在 YAML/剧本编辑场景的适用性
    priority: high
    search_queries:
      - "CodeMirror 6 vs Monaco Editor comparison 2024"
      - "CodeMirror 6 YAML editing plugin extension"
      - "Monaco Editor YAML language support"
      - "best web based code editor for YAML editing"

  - id: fastapi_vs_flask
    name: FastAPI vs Flask vs Django（后端框架）
    description: 对比 Python 后端框架，重点考察 SSE 支持、异步能力、性能
    priority: high
    search_queries:
      - "FastAPI vs Flask vs Django 2024 performance comparison"
      - "FastAPI SSE Server Sent Events tutorial"
      - "FastAPI vs Flask async performance benchmark 2024"
      - "Python backend framework for desktop app API"

  - id: pyinstaller_vs_nuitka
    name: PyInstaller vs Nuitka（Python 打包工具）
    description: 对比 Python 应用打包方案，重点考察打包体积、启动速度、兼容性
    priority: medium
    search_queries:
      - "PyInstaller vs Nuitka comparison 2024 Python packaging"
      - "PyInstaller 打包 Python 应用 最佳实践"
      - "Nuitka Python compiler performance startup time"
      - "Python 桌面应用 打包方案 选择"

config:
  language: zh-CN
  max_results_per_query: 5
  search_depth: deep
  output_format: markdown

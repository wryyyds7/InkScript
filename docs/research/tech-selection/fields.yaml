# 技术选型调研字段定义

fields:
  - id: overview
    name: 技术概述
    description: 该技术的基本介绍、核心特性、生态情况
    type: text
    required: true

  - id: pros
    name: 优势
    description: 该技术的优势、适用场景
    type: text
    required: true

  - id: cons
    name: 劣势
    description: 该技术的劣势、不适用场景、已知问题
    type: text
    required: true

  - id: performance
    name: 性能表现
    description: 启动速度、运行时性能、内存占用等关键指标
    type: text
    required: false

  - id: ecosystem
    name: 生态与社区
    description: 社区活跃度、第三方库支持、文档质量
    type: text
    required: false

  - id: fit_for_project
    name: 对 Novel2Script 的适用性
    description: 结合项目需求（桌面壳、SSE、YAML编辑等）评估适用性
    type: text
    required: true

  - id: recommendation
    name: 推荐结论
    description: 综合评估后的推荐意见和理由
    type: text
    required: true

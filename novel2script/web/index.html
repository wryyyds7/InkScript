<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novel2Script - 小说转剧本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- CodeMirror 主题 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@codemirror/theme-one-dark@6.1.2/theme/one-dark.css" />
    <!-- 使用 jsdelivr.net ?bundle 模式（单一 bundle 确保依赖唯一） -->
    <script type="importmap">
    {
        "imports": {
            "@codemirror/lang-yaml": "https://cdn.jsdelivr.net/npm/@codemirror/lang-yaml@6.1.3/+esm?bundle",
            "@codemirror/theme-one-dark": "https://cdn.jsdelivr.net/npm/@codemirror/theme-one-dark@6.1.2/+esm?bundle",
            "@codemirror/lint": "https://cdn.jsdelivr.net/npm/@codemirror/lint@6.8.0/+esm?bundle",
            "yaml": "https://cdn.jsdelivr.net/npm/yaml@2.3.4/+esm?bundle"
        }
    }
    </script>
    <link rel="stylesheet" href="/css/app.css" />
    <!-- Chart.js CDN（情绪曲线可视化） -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <!-- SortableJS CDN（节拍板拖拽排序） -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <!-- 情绪曲线可视化模块 -->
    <script type="module" src="/js/emotion-curve.js?v=20260607"></script>
    <!-- Beat 可视化编辑模块 -->
    <script type="module" src="/js/beat-board.js?v=20260607"></script>
    <style>
        /* Beat 编辑器弹出层样式 */
        .beat-editor-popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            z-index: 1000;
            min-width: 320px;
            max-width: 480px;
        }
        .beat-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
        }
        .beat-type-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .beat-type-dialogue { background: #dbeafe; color: #1e40af; }
        .beat-type-action { background: #fef3c7; color: #92400e; }
        .beat-type-narration { background: #d1fae5; color: #065f46; }
        .beat-type-heading { background: #e9d5ff; color: #6b21a8; }
        .beat-type-transition { background: #f3f4f6; color: #374151; }
        .beat-editor-close {
            background: none; border: none; font-size: 18px; cursor: pointer; color: #6b7280;
        }
        .beat-editor-body { padding: 16px; }
        .beat-field { margin-bottom: 12px; }
        .beat-field label { display: block; font-size: 12px; font-weight: 500; color: #374151; margin-bottom: 4px; }
        .beat-input-character, .beat-input-emotion, .beat-input-content {
            width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px;
        }
        .beat-input-content { resize: vertical; }
        .beat-editor-footer {
            display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid #e5e7eb;
        }
        .beat-editor-cancel { padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 4px; background: white; cursor: pointer; font-size: 13px; }
        .beat-editor-save { padding: 6px 12px; border: none; border-radius: 4px; background: #4f46e5; color: white; cursor: pointer; font-size: 13px; }
        .beat-editor-save:hover { background: #4338ca; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="app()">
        <!-- 顶栏 -->
        <header class="bg-white shadow-sm border-b px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-bold text-indigo-600 cursor-pointer" @click="goHome()">Novel2Script</h1>
                <!-- 导航按钮 -->
                <div class="flex gap-1 ml-4" x-show="view !== 'home'">
                    <button @click="goBack()" class="btn-nav" aria-label="返回上一页" title="返回上一页">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    返回
                </button>
                </div>
            </div>
            <nav class="flex gap-2" aria-label="主导航">
                <button @click="view='projects'" :class="view==='projects' ? 'btn-active' : 'btn'" aria-label="项目列表">项目</button>
                <button @click="view='editor'" :class="view==='editor' ? 'btn-active' : 'btn'" :disabled="!activeProject" aria-label="剧本编辑器">编辑器</button>
                <button @click="view='skills'" :class="view==='skills' ? 'btn-active' : 'btn'" aria-label="Skills 管理">Skills</button>
                <button @click="toggleTrash()" :class="showTrash ? 'btn-active' : 'btn'" aria-label="回收站">回收站</button>
                <button @click="view='config'" :class="view==='config' ? 'btn-active' : 'btn'" aria-label="设置页面">设置</button>
            </nav>
        </header>

    <!-- 主内容区 -->
    <main class="p-4">
        <!-- 封面页（默认首页） -->
        <template x-if="view === 'home'">
            <div class="max-w-6xl mx-auto">
                <!-- Hero 区域（优化：添加动画和渐变背景） -->
                <div class="text-center py-16 mb-12 hero-gradient rounded-3xl animate-fade-in-up">
                    <div class="w-32 h-32 bg-white bg-opacity-20 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-2xl animate-pulse">
                        <svg class="w-16 h-16 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                        </svg>
                    </div>
                    <h2 class="text-5xl font-bold text-white mb-6 drop-shadow-lg">将小说智能转换为剧本</h2>
                    <p class="text-xl text-white text-opacity-90 max-w-3xl mx-auto leading-relaxed">
                        InkScript 使用 AI 技术，自动将小说文本转换为结构化剧本格式。<br>
                        支持多种 AI 模型，提供可视化的剧本编辑体验。
                    </p>
                    <!-- 添加 CTA 按钮 -->
                    <div class="mt-10 flex justify-center gap-4">
                        <button @click="view='projects'" class="btn-primary text-lg px-8 py-3 shadow-xl hover:shadow-2xl">
                            开始使用
                        </button>
                        <button @click="showShortcutsModal = true" class="btn bg-white bg-opacity-20 text-white hover:bg-opacity-30 text-lg px-8 py-3">
                            查看快捷键
                        </button>
                    </div>
                </div>

                <!-- 功能入口（优化：添加动画和卡片悬停效果） -->
                <div class="grid grid-cols-3 gap-8 mb-12">
                    <!-- 创建项目 -->
                    <div @click="createProject()" class="feature-card cursor-pointer animate-fade-in-up" style="animation-delay: 0.1s;">
                        <div class="w-16 h-16 bg-gradient-to-br from-green-400 to-green-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg transform rotate-3 hover:rotate-6 transition-transform">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                            </svg>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-3">创建项目</h3>
                        <p class="text-gray-600 leading-relaxed">新建一个转换项目，开始你的剧本创作之旅</p>
                        <!-- 添加箭头指示 -->
                        <div class="mt-4 flex items-center text-green-600 font-medium text-sm">
                            <span>开始创建</span>
                            <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                            </svg>
                        </div>
                    </div>

                    <!-- 打开项目 -->
                    <div @click="view='projects'" class="feature-card cursor-pointer animate-fade-in-up" style="animation-delay: 0.2s;">
                        <div class="w-16 h-16 bg-gradient-to-br from-blue-400 to-blue-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg transform -rotate-3 hover:-rotate-6 transition-transform">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                            </svg>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-3">打开项目</h3>
                        <p class="text-gray-600 leading-relaxed">查看和管理你的所有项目</p>
                        <div class="mt-4 flex items-center text-blue-600 font-medium text-sm">
                            <span>查看项目</span>
                            <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                            </svg>
                        </div>
                    </div>

                    <!-- 打开编辑器 -->
                    <div @click="activeProject ? view='editor' : alert('请先选择或创建一个项目')" class="feature-card cursor-pointer animate-fade-in-up" style="animation-delay: 0.3s;">
                        <div class="w-16 h-16 bg-gradient-to-br from-purple-400 to-purple-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg transform rotate-3 hover:rotate-6 transition-transform">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a 2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                            </svg>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-3">打开编辑器</h3>
                        <p class="text-gray-600 leading-relaxed">进入剧本编辑器，编辑和预览转换结果</p>
                        <div class="mt-4 flex items-center text-purple-600 font-medium text-sm">
                            <span>立即编辑</span>
                            <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- 最近项目（优化：添加卡片悬停效果） -->
                <div class="bg-white rounded-2xl shadow-sm p-6 animate-fade-in" x-show="projects.length > 0">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">最近项目</h3>
                    <div class="space-y-3">
                        <template x-for="p in projects.slice(0, 5)" :key="p.id">
                            <div 
                                @click="openProject(p.id)" 
                                @keydown.enter="openProject(p.id)"
                                @keydown.space.prevent="openProject(p.id)"
                                class="project-card flex items-center justify-between" 
                                tabindex="0" 
                                role="button" 
                                :aria-label="'打开项目 ' + p.name">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-12 bg-gradient-to-br from-indigo-400 to-indigo-600 rounded-xl flex items-center justify-center shadow-md">
                                        <span class="text-sm font-bold text-white" x-text="p.name.charAt(0).toUpperCase()"></span>
                                    </div>
                                    <div>
                                        <h4 class="font-medium text-gray-900" x-text="p.name"></h4>
                                        <p class="text-xs text-gray-500" x-text="'创建于 ' + new Date(p.created_at).toLocaleDateString()"></p>
                                    </div>
                                </div>
                                <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                </svg>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 功能特性展示（优化：添加图标动画） -->
                <div class="mt-12 bg-white rounded-2xl shadow-sm p-8 animate-fade-in">
                    <h3 class="text-2xl font-bold text-gray-900 mb-8 text-center">强大功能，简单易用</h3>
                    <div class="grid grid-cols-2 gap-6">
                        <div class="flex items-start gap-4 p-5 bg-gradient-to-br from-indigo-50 to-white rounded-xl hover:shadow-md transition-shadow">
                            <div class="w-12 h-12 bg-gradient-to-br from-indigo-400 to-indigo-600 rounded-xl flex items-center justify-center flex-shrink-0 shadow-md transform hover:scale-110 transition-transform">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                                </svg>
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-900 mb-2">AI 智能转换</h4>
                                <p class="text-sm text-gray-600 leading-relaxed">支持多种 AI 模型，自动识别角色、场景和对话，快速生成专业剧本</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-4 p-5 bg-gradient-to-br from-green-50 to-white rounded-xl hover:shadow-md transition-shadow">
                            <div class="w-12 h-12 bg-gradient-to-br from-green-400 to-green-600 rounded-xl flex items-center justify-center flex-shrink-0 shadow-md transform hover:scale-110 transition-transform">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-900 mb-2">实时进度推送</h4>
                                <p class="text-sm text-gray-600 leading-relaxed">通过 SSE 实时查看转换进度，支持断点续传，永不丢失进度</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-4 p-5 bg-gradient-to-br from-yellow-50 to-white rounded-xl hover:shadow-md transition-shadow">
                            <div class="w-12 h-12 bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-xl flex items-center justify-center flex-shrink-0 shadow-md transform hover:scale-110 transition-transform">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 011-1H4a2 2 0 110-4h1a1 1 0 011 1V7a1 1 0 011-1h3a1 1 0 011-1V4z"/>
                                </svg>
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-900 mb-2">可视化编辑</h4>
                                <p class="text-sm text-gray-600 leading-relaxed">双面板编辑器，支持语法高亮和实时预览，编辑体验流畅自然</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-4 p-5 bg-gradient-to-br from-red-50 to-white rounded-xl hover:shadow-md transition-shadow">
                            <div class="w-12 h-12 bg-gradient-to-br from-red-400 to-red-600 rounded-xl flex items-center justify-center flex-shrink-0 shadow-md transform hover:scale-110 transition-transform">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v16 1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                                </svg>
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-900 mb-2">多格式导出</h4>
                                <p class="text-sm text-gray-600 leading-relaxed">支持导出为 YAML、Fountain、TXT 等格式，满足不同场景需求</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- 项目列表 -->
        <template x-if="view === 'projects'">
            <div class="animate-fade-in">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-900">项目列表</h2>
                    <div class="flex gap-3">
                        <!-- 搜索框 -->
                        <div class="relative">
                            <input type="text" 
                                   x-model="projectSearch" 
                                   @input="searchProjects()"
                                   placeholder="搜索项目..." 
                                   class="pl-9 pr-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 w-48" />
                            <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </div>
                        <!-- 排序下拉 -->
                        <select x-model="projectSortBy" @change="searchProjects()" 
                                class="px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            <option value="updated_at">按更新时间</option>
                            <option value="created_at">按创建时间</option>
                            <option value="name">按名称</option>
                        </select>
                        <!-- 排序方向按钮 -->
                        <button @click="projectSortOrder = projectSortOrder === 'asc' ? 'desc' : 'asc'; searchProjects()" 
                                class="px-3 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 font-bold"
                                title="切换排序方向">
                            <span x-text="projectSortOrder === 'asc' ? '↑ 升序' : '↓ 降序'"></span>
                        </button>
                        <button @click="createProject()" class="btn-primary text-lg px-6 py-3">
                            <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                            </svg>
                            新建项目
                        </button>
                    </div>
                </div>
                
                <!-- Loading 状态 -->
                <div x-show="loadingProjects" class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                    <p class="mt-4 text-gray-600">加载中...</p>
                </div>
                
                <!-- 项目列表 -->
                <div class="grid gap-4" x-show="!loadingProjects">
                    <template x-for="p in projects" :key="p.id">
                        <div class="project-card flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 bg-gradient-to-br from-indigo-400 to-indigo-600 rounded-xl flex items-center justify-center shadow-md">
                                    <span class="text-lg font-bold text-white" x-text="p.name.charAt(0).toUpperCase()"></span>
                                </div>
                                <div>
                                    <h3 class="font-bold text-gray-900 text-lg" x-text="p.name"></h3>
                                    <p class="text-sm text-gray-500 mt-1" x-text="'创建时间：' + new Date(p.created_at).toLocaleString()"></p>
                                </div>
                            </div>
                            <div class="flex gap-3">
                                <button @click="openProject(p.id)" class="btn text-indigo-600 hover:bg-indigo-50 px-4 py-2">
                                    <svg class="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.522 5 12 5c4.478 0 8.268 2.943 9.542 7"/>
                                    </svg>
                                    打开
                                </button>
                                <button @click="deleteProject(p.id)" class="btn text-red-600 hover:bg-red-50 px-4 py-2">
                                    <svg class="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                    </svg>
                                    删除
                                </button>
                            </div>
                        </div>
                    </template>
                    <div x-show="projects.length === 0" class="text-gray-500 text-center py-12">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                        </svg>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkScript - 小说转剧本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-gray-50 min-h-screen" x-data="app()">
    <!-- 顶栏 -->
    <header class="bg-white shadow-sm border-b px-4 py-3 flex items-center justify-between">
        <h1 class="text-xl font-bold text-indigo-600">InkScript</h1>
        <nav class="flex gap-2">
            <button @click="view='projects'" :class="view==='projects' ? 'btn-active' : 'btn'">项目</button>
            <button @click="view='editor'" :class="view==='editor' ? 'btn-active' : 'btn'" :disabled="!activeProject">编辑器</button>
            <button @click="view='config'" :class="view==='config' ? 'btn-active' : 'btn'">设置</button>
        </nav>
    </header>

    <!-- 主内容区 -->
    <main class="p-4">
        <!-- 项目列表 -->
        <template x-if="view === 'projects'">
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">项目列表</h2>
                    <button @click="createProject()" class="btn-primary">新建项目</button>
                </div>
                <div id="project-list" class="grid gap-3"></div>
            </div>
        </template>

        <!-- 编辑器 -->
        <template x-if="view === 'editor'">
            <div id="editor-container"></div>
        </template>

        <!-- 设置 -->
        <template x-if="view === 'config'">
            <div id="config-panel" class="max-w-lg mx-auto"></div>
        </template>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
